<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- <script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script> -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <script src="./wxLogin.js"></script>
  <script src="./wx.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login_area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 300px;
      min-height: 300px;
      padding: 20px;
      background-color: #f2f2f2;
      border-radius: 10px;
      box-shadow: 0 0 10px #888888;
    }

    img {
      width: 80px;
      height: 80px;
    }

    .login_btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .login_btn:hover {
      background-color: #3e8e41;
      box-shadow: 0 0 10px #3e8e41;
    }

    .login_img {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 50%;
      box-sizing: border-box;
      background-color: rgba(20, 25, 29, 1);
      border: 3px solid rgba(225, 225, 225, 0.2);
    }

    .login_img:hover {
      box-shadow: 0 0 15px #888888;
    }

    .fileIpt {
      cursor: pointer;
    }

    p {
      margin-top: 20px;
      font-size: 18px;
    }

    .flex {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flex-direction-row {
      flex-direction: row;
    }

    .flex-direction-row-reverse {
      flex-direction: row-reverse;
    }

    .flex-direction-column {
      flex-direction: column;
    }

    .flex-direction-column-reverse {
      flex-direction: column-reverse;
    }

    .flex-wrap {
      flex-wrap: wrap;
    }

    .flex-no-wrap {
      flex-wrap: nowrap;
    }

    .flex-wrap-reverse {
      flex-wrap: wrap-reverse;
    }

    .align-items-center {
      align-items: center;
    }

    .align-items-flex-start {
      align-items: flex-start;
    }

    .align-items-flex-end {
      align-items: flex-end;
    }

    .align-items-start {
      align-items: start;
    }

    .align-items-end {
      align-items: end;
    }

    .toast {
      position: fixed;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 16px;
      z-index: 1000;
    }

    .irregular-rounded {
      width: 355px;
      min-height: 155px;
      margin-top: 10px;
      background-color: rgba(16, 39, 43, 1);
      clip-path: polygon(
          /* 左上 - 直角 */
          0% 0%,
          /* 顶部 - 轻微弧线 */
          15% 0%, 30% 10px, 45% 5px, 60% 10px, 85% 0%,
          /* 右上 - 圆角 */
          100% 0%, 100% 20px,
          /* 右侧 - 直线 */
          100% 80%,
          /* 右下 - 圆角 */
          100% 100%, calc(100% - 20px) 100%,
          /* 底部 - 波浪 */
          80% 100%, 65% calc(100% - 10px), 50% 100%,
          35% calc(100% - 10px), 20% 100%,
          /* 左下 - 直角 */
          0% 100%, 0% 80%);
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="login_area" v-if="showLogin">
      <div class="login_img">
        <img src="./logo.webp" alt="logo">
      </div>
      <div>
        <button class="login_btn" @click="login">Login</button>
      </div>
    </div>
    <div class="login_area" v-else>
      <div class="login_img" @click="changeAvatar">
        <img :src="avatarUrl" alt="logo">
      </div>
      <div class="flex flex-direction-column align-items-center justify-content-center">
        <p>{{userName}}</p>
        <button class="login_btn" @click="logout">Logout</button>
        <p><input class="fileIpt" type="file" v-model="defFile" @change="openFile"></p>
        <p><a :href="avatarUrl" download>下载</a></p>
      </div>
    </div>
    <div class="main">
      <div class="irregular-rounded"></div>
    </div>
    <!-- <Toast v-if="showToast" :text="toastText" /> -->
    <div class="toast" v-if="showToast">{{toastText}}</div>
  </div>
  <script type="module">
    // import wyb from './wx.js';
    class WxLogin {
      constructor(options) {
        this.appid = options.appid;
        this.scope = options.scope;
        this.redirect_uri = options.redirect_uri;
      };
      login () {
        return new Promise((resolve, reject) => {
          wyb.login({
            success: loginRes => {
              if (loginRes.code) {
                wyb.getUserInfo({
                  success: res => {
                    resolve({
                      code: loginRes.code,
                      userInfo: res.userInfo
                    });
                  },
                  fail: err => {
                    reject(err);
                  }
                });
              } else {
                reject(loginRes);
              }
            },
            fail: err => {
              reject(err);
            }
          });
        });
      };
      logout () {
        return new Promise((resolve, reject) => {
          wyb.logout({
            success: res => {
              resolve(res);
            },
            fail: err => {
              reject(err);
            }
          });
        });
      }
    }
    const wxLogin = new WxLogin({
      appid: 'wx1234567890abcdef',
      scope: 'jsapi_login',
      redirect_uri: 'http://localhost:8080/html/wxLogin/index.html'
    });
    const dataArr = Proxy.revocable([], {
      set: (target, key, value) => {
        console.log('set', key, value);
        target[key] = value;
        return true;
      },
      get: (target, key) => {
        console.log('get', key);
        return target[key];
      }
    });
    const { createApp } = Vue
    const app = createApp({
      data () {
        return {
          showLogin: true,
          userName: '',
          avatarUrl: 'https://thirdwx.qlogo.cn/mmopen/vi_32/POgEwh4mIHO4nibH0KlMECNjjGxQUq24ZEaGT4poC6icRiccVGKSyXwibcPq4BWmiaIGuG1icwxaQX6grC9VemZoJ8rg/132',
          toastText: '',
          defFile: null,
          showToast: false,
        }
      },
      components: {
        Toast: {
          template: '<div class="toast" v-if="show">{{text}}</div>',
          props: ['text'],
          data () {
            return {
              show: true,
            }
          }
        }
      },
      methods: {
        login: function () {
          wxLogin.login().then(res => {
            this.showLogin = false;
            this.userName = res.userInfo.nickName;
            this.avatarUrl = res.userInfo.avatarUrl;
            this.showToast = true;
            this.toastText = '登录成功!';
            // console.log(res, this.showToast, this.toastText);
            window.localStorage.setItem('wx_token', res.code);
            window.localStorage.setItem('wx_userInfo', JSON.stringify(res.userInfo));
            setTimeout(() => {
              this.showToast = false;
              this.toastText = '';
            }, 1000);
          }).catch(err => {
            console.log(err);
            this.showToast = true;
            this.toastText = '登录失败!';
            setTimeout(() => {
              this.showToast = false;
              this.toastText = '';
            }, 1000);
          });
        },
        logout: function () {
          wxLogin.logout().then(() => {
            this.showLogin = true;
            this.userName = '';
            this.showToast = true;
            this.toastText = '退出成功!';
            setTimeout(() => {
              this.showToast = false;
              this.toastText = '';
              window.localStorage.removeItem('wx_token');
              window.localStorage.removeItem('wx_userInfo');
            }, 1000);
          }).catch(err => {
            console.log(err);
            this.showToast = true;
            this.toastText = '退出失败!';
            setTimeout(() => {
              this.showToast = false;
              this.toastText = '';
            }, 1000);
          });
        },
        openImg: async function () {
          const files = await window.showOpenFilePicker({
            type: 'open-file',
            accepts: [
              {
                description: 'Images',
                extensions: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'ico'],
              },
            ],
            multiple: false,
          }).catch((err) => {
            console.error('Error selecting file:', err);
          });
          // console.log('files', files);
          if (files) {
            const fileHandle = files[0];
            const fileBlob = await fileHandle.getFile();
            const fileReader = new FileReader();
            fileReader.readAsDataURL(fileBlob);
            fileReader.onload = (e) => {
              console.log('e', e)
              this.avatarUrl = e.target.result;
              let userInfo = JSON.parse(window.localStorage.getItem('wx_userInfo'));
              userInfo.avatarUrl = e.target.result;
              window.localStorage.setItem('wx_userInfo', JSON.stringify(userInfo));
            };
          }
        },
        openImg2: async function () {
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = 'image/*';
          document.body.appendChild(fileInput);
          let files = null;
          const fileReader = new FileReader();
          const onChange = () => {
            console.log('onChange', files, fileInput.files);
            files = fileInput.files ? Array.from(fileInput.files) : [];
            fileInput.removeEventListener('change', onChange);
            setTimeout(() => document.body.removeChild(fileInput), 0);
            if (files.length) {
              console.log('files', files);
              fileReader.readAsDataURL(files[0]);
              fileReader.onload = (e) => {
                console.log('e', e)
                this.avatarUrl = e.target.result;
                let userInfo = JSON.parse(window.localStorage.getItem('wx_userInfo'));
                userInfo.avatarUrl = e.target.result;
                window.localStorage.setItem('wx_userInfo', JSON.stringify(userInfo));
              };
            }
          };
          fileInput.addEventListener('change', onChange);
          fileInput.click();
        },
        changeAvatar: async function () {
          await this.openImg2()
        },
        openFile: function (e) {
          console.log('e', e, e.target.files, this.defFile);
          const files = e.target.files ? Array.from(e.target.files) : [];
          if (files.length) {
            const file = files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
              console.log('e', e)
              this.defFile = e.target.result;
            };
          }
        }
      },
      mounted () {
        console.log('App mounted.');
        const token = window.localStorage.getItem('wx_token');
        if (token) {
          this.showLogin = false;
          this.userName = JSON.parse(window.localStorage.getItem('wx_userInfo')).nickName || '';
          this.avatarUrl = JSON.parse(window.localStorage.getItem('wx_userInfo')).avatarUrl || this.avatarUrl
        }
      }
    }).mount('#app');
    /* app.component('toast', {
      template: '<div class="toast" v-if="show">{{text}}</div>',
      data () {
        return {
          show: false,
          text: ''
        }
      },
    }) */
  </script>
</body>

</html>
