<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>点击散开 · 彩球圆环</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: #0b0e1a;
      background-image: radial-gradient(circle at 20% 30%, #1a1f30 0%, #0a0c14 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      cursor: crosshair;
      overflow: hidden;
      touch-action: none;
    }

    /* 画布全屏，捕获所有点击 */
    #burstCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      pointer-events: auto;
      z-index: 10;
      background: transparent;
    }

    /* 装饰水印 —— 致敬截图里的“张书樵 / 力电声光热” */
    .brand-tip {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.06);
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: 300;
      pointer-events: none;
      z-index: 1;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(1px);
      padding: 8px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .brand-tip span {
      opacity: 0.6;
      display: inline-block;
      margin: 0 10px;
    }

    .brand-tip .highlight {
      color: rgba(255, 200, 120, 0.15);
      font-weight: 400;
    }

    @media (max-width: 480px) {
      .brand-tip {
        font-size: 11px;
        bottom: 12px;
      }
    }

    /* 让 canvas 捕获点击，同时不干扰背景交互 */
    #burstCanvas {
      touch-action: none;
    }
  </style>
</head>

<body>

  <!-- 主画布：所有粒子与圆环绘制在此 -->
  <canvas id="burstCanvas"></canvas>

  <!-- 仅供视觉点缀，模仿截图中“张书樵 / 力电声光热”氛围 -->
  <div class="brand-tip">
    <span>⚡</span>
    <span class="highlight">张书樵</span>
    <span>·</span>
    <span>力电声光热</span>
    <span>·</span>
    <span>涵尽学海无涯</span>
    <span>✨</span>
  </div>

  <script>
    (function () {
      "use strict";

      const canvas = document.getElementById('burstCanvas');
      const ctx = canvas.getContext('2d');

      // ---------- 尺寸自适应 ----------
      let width = 0, height = 0;
      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // ---------- 粒子系统 ----------
      // 每个爆发事件：包含多个粒子 + 多个圆环
      // 粒子: { x, y, vx, vy, radius, color, life, maxLife, shrink, alpha }
      // 圆环: { x, y, maxRadius, currentRadius, lineWidth, color, alpha, life, maxLife, speed }

      let particles = [];
      let rings = [];

      // 颜色调色板 (高饱和，明亮)
      const colorPalette = [
        '#FF6B6B', '#FF9F43', '#FECA57', '#48DBFB', '#0ABDE3',
        '#A29BFE', '#FD79A8', '#00B894', '#FDCB6E', '#E17055',
        '#74B9FF', '#55EFC4', '#FDA7DF', '#F8A5C2', '#81ECEC',
        '#FFEAA7', '#DDA0DD', '#FF8A5C', '#A8E6CF', '#FFD3B4'
      ];

      // 工具: 随机范围
      const rand = (min, max) => Math.random() * (max - min) + min;
      const randInt = (min, max) => Math.floor(rand(min, max + 1));

      // 生成一次爆发 (点击位置)
      function createBurst(centerX, centerY) {
        const count = 28 + Math.floor(Math.random() * 18); // 28~45 个粒子
        const ringCount = 2 + Math.floor(Math.random() * 3); // 2~4 个圆环

        // ----- 粒子 -----
        for (let i = 0; i < count; i++) {
          // 随机方向 (均匀分布)
          const angle = rand(0, Math.PI * 2);
          // 速度: 向外散开，有快有慢 (80~280 像素/秒)
          const speed = rand(120, 380);
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;

          // 半径: 4~16px，小粒子更轻快
          const radius = rand(4, 15);
          // 颜色: 从调色板随机取，并加入随机亮度变化
          let baseColor = colorPalette[randInt(0, colorPalette.length - 1)];
          // 随机微调颜色 (让同一色系有变化)
          const color = baseColor; // 保持简洁，也可直接使用

          // 生命周期: 0.8~1.6 秒
          const maxLife = rand(0.7, 1.6);
          // 每个粒子初始 alpha 1.0
          // shrink: 每帧缩小比例 (0.96~0.995) 使粒子逐渐消失
          const shrink = rand(0.965, 0.995);

          particles.push({
            x: centerX,
            y: centerY,
            vx: vx,
            vy: vy,
            radius: radius,
            color: color,
            life: 0,
            maxLife: maxLife,
            shrink: shrink,
            alpha: 1.0,
            // 附加随机旋转偏移 (视觉丰富)
            rot: rand(0, Math.PI * 2),
            rotSpeed: rand(-2, 2)
          });
        }

        // ----- 圆环 (浅色光环) -----
        for (let i = 0; i < ringCount; i++) {
          // 每个环大小不一，扩张速度不同
          const maxRadius = rand(40, 130);
          const speed = rand(60, 180); // 半径增长速度 (px/s)
          // 线宽: 2~6px
          const lineWidth = rand(1.8, 5.5);
          // 颜色: 半透明白/浅色系 (带一点色相)
          const hue = rand(0, 360);
          // 使用 hsla 让圆环带有淡彩，同时保证浅色
          const alpha = rand(0.25, 0.6);
          const color = `hsla(${hue}, 70%, 75%, ${alpha})`;
          // 生命周期 0.9~1.8 秒 (比粒子稍长)
          const maxLife = rand(0.9, 1.9);

          rings.push({
            x: centerX,
            y: centerY,
            maxRadius: maxRadius,
            currentRadius: 2,        // 起始半径很小
            lineWidth: lineWidth,
            color: color,
            alpha: alpha,
            life: 0,
            maxLife: maxLife,
            speed: speed,
            // 额外柔光参数 (用于二次衰减)
          });
        }
      }

      // ---------- 更新 & 绘制 ----------
      let lastTimestamp = 0;

      function animate(timestamp) {
        const delta = lastTimestamp ? Math.min((timestamp - lastTimestamp) / 1000, 0.05) : 0.016;
        lastTimestamp = timestamp;

        // 1. 更新粒子
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += delta;
          // 生命结束 → 移除
          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }

          // 移动
          p.x += p.vx * delta;
          p.y += p.vy * delta;

          // 阻力 / 减速 (让粒子慢慢停下，更自然)
          p.vx *= (1 - delta * 0.8);
          p.vy *= (1 - delta * 0.8);

          // 半径缩小 (逐渐消失)
          p.radius *= p.shrink;
          if (p.radius < 0.15) p.radius = 0.15;

          // 透明度: 基于生命进度 逐渐变淡，最后消失
          const lifeRatio = p.life / p.maxLife;
          // 前60%保持高透明度，后40%急剧下降
          let alpha = 1.0;
          if (lifeRatio > 0.45) {
            alpha = 1.0 - (lifeRatio - 0.45) / 0.55;
          }
          // 限制范围并附加随机闪烁 (活泼)
          alpha = Math.min(1, Math.max(0, alpha));
          p.alpha = alpha * (0.9 + 0.1 * Math.sin(timestamp / 200 + p.rot));
        }

        // 2. 更新圆环
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i];
          r.life += delta;
          if (r.life >= r.maxLife) {
            rings.splice(i, 1);
            continue;
          }

          // 半径扩张
          r.currentRadius += r.speed * delta;
          // 如果超过最大半径则限制 (但也会随着生命结束消失)
          if (r.currentRadius > r.maxRadius) {
            r.currentRadius = r.maxRadius;
          }

          // 透明度: 随着生命进度逐渐变淡 (同时扩张时也慢慢变淡)
          const lifeRatio = r.life / r.maxLife;
          let alpha = 1.0 - lifeRatio * 0.95;
          // 并且随着半径接近最大半径，透明度再衰减一些
          const radiusRatio = r.currentRadius / r.maxRadius;
          const fadeFromRadius = 0.3;
          let radiusFade = 1.0;
          if (radiusRatio > fadeFromRadius) {
            radiusFade = 1.0 - (radiusRatio - fadeFromRadius) / (1 - fadeFromRadius) * 0.7;
          }
          alpha = alpha * radiusFade;
          alpha = Math.min(1, Math.max(0, alpha));
          r.alpha = alpha;
        }

        // ---------- 绘制 ----------
        ctx.clearRect(0, 0, width, height);

        // 先绘制圆环 (在粒子下方，产生光晕层次)
        for (const r of rings) {
          if (r.alpha < 0.005 || r.currentRadius < 0.5) continue;

          ctx.save();
          ctx.globalAlpha = r.alpha * 0.8;
          ctx.strokeStyle = r.color;
          ctx.lineWidth = r.lineWidth;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.currentRadius, 0, Math.PI * 2);
          ctx.stroke();

          // 额外增加一圈更淡的外发光 (模糊效果模拟)
          if (r.currentRadius > 8) {
            ctx.globalAlpha = r.alpha * 0.15;
            ctx.lineWidth = r.lineWidth * 1.8;
            ctx.strokeStyle = 'white';
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.currentRadius * 0.92, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        }

        // 绘制粒子 (圆球)
        for (const p of particles) {
          if (p.alpha < 0.01 || p.radius < 0.2) continue;

          ctx.save();
          ctx.globalAlpha = p.alpha;
          // 主球体：径向渐变，让球体更有立体感
          const gradient = ctx.createRadialGradient(
            p.x - p.radius * 0.25, p.y - p.radius * 0.25, p.radius * 0.1,
            p.x, p.y, p.radius
          );
          // 从白色到彩色
          gradient.addColorStop(0, '#FFFFFF');
          gradient.addColorStop(0.3, p.color);
          gradient.addColorStop(1, p.color);

          ctx.shadowColor = p.color;
          ctx.shadowBlur = 14;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();

          // 高光小点 (更立体)
          ctx.shadowBlur = 0;
          ctx.globalAlpha = p.alpha * 0.5;
          ctx.beginPath();
          ctx.arc(p.x - p.radius * 0.2, p.y - p.radius * 0.25, p.radius * 0.2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(animate);
      }

      // ---------- 事件监听 (点击/触摸) ----------
      function handleBurst(e) {
        let clientX, clientY;
        if (e.touches) {
          // 触摸事件
          e.preventDefault();
          const touch = e.touches[0];
          if (!touch) return;
          clientX = touch.clientX;
          clientY = touch.clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        // 确保坐标在canvas范围内 (防止边缘溢出)
        const rect = canvas.getBoundingClientRect();
        const x = Math.min(rect.width, Math.max(0, clientX - rect.left));
        const y = Math.min(rect.height, Math.max(0, clientY - rect.top));

        createBurst(x, y);

        // 额外: 可以在点击处产生一个小的“冲击”效果 (但无需额外操作)
      }

      // 鼠标 / 触摸 绑定
      canvas.addEventListener('click', handleBurst);
      canvas.addEventListener('touchstart', handleBurst, { passive: false });

      // 防止页面滚动 / 缩放 (针对移动端)
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
      }, { passive: false });

      // 启动动画
      requestAnimationFrame(animate);

      // 初始在屏幕中央产生一次爆发，展示效果 (可选)
      window.addEventListener('load', () => {
        setTimeout(() => {
          const cx = width / 2;
          const cy = height / 2;
          createBurst(cx, cy);
          // 再额外一次偏移
          setTimeout(() => {
            createBurst(width * 0.3, height * 0.4);
          }, 200);
        }, 300);
      });

      // 暴露重绘 (窗口变化自适应)
      window.addEventListener('resize', () => {
        // 画布尺寸已更新，但粒子位置不变，无影响
      });

      console.log('✨ 点击任意位置 · 彩球与光环扩散');
    })();
  </script>
</body>

</html>
