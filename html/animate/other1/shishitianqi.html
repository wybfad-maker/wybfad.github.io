<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时天气卡片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    .weather-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 08px32pxrgba(0, 0, 0, 0.1);
      padding: 24px;
      max-width: 280px;
      width: 100%;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .weather-card:hover {
      transform: translateY(-3px);
      box-shadow: 012px40pxrgba(0, 0, 0, 0.15);
    }

    .location {
      text-align: center;
      margin-bottom: 16px;
    }

    .location-icon {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .city-name {
      font-size: 20px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .current-time {
      font-size: 12px;
      color: #888;
      font-weight: 500;
    }

    .weather-main {
      text-align: center;
      margin: 20px0;
    }

    .weather-icon {
      font-size: 56px;
      margin-bottom: 8px;
    }

    .temperature {
      font-size: 42px;
      font-weight: 300;
      color: #333;
      line-height: 1;
    }

    .temperaturespan {
      font-size: 22px;
      vertical-align: top;
    }

    .weather-description {
      font-size: 16px;
      color: #666;
      margin-top: 6px;
      text-transform: capitalize;
      margin-right: 20px;
    }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
    }

    .detail-item {
      text-align: center;
      padding: 8px6px;
      background: #f8f9fa;
      border-radius: 10px;
      transition: background 0.3s ease;
    }

    .detail-item:hover {
      background: #e9ecef;
    }

    .detail-icon {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 2px;
    }

    .detail-label {
      font-size: 10px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .loading {
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }

    .refresh-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      width: 100%;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .refresh-btn:hover {
      transform: scale(1.02);
      box-shadow: 05px20pxrgba(102, 126, 234, 0.4);
    }

    .refresh-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <div class="weather-card" id="weatherCard">
    <div class="location">
      <div class="location-icon">📍</div>
      <div class="city-name" id="cityName">获取位置中...</div>
      <div class="current-time" id="currentTime">--:--:--</div>
    </div>

    <div id="weatherContent">
      <div class="loading">正在获取天气信息...</div>
    </div>
  </div>


  <script>
    // 天气图标映射
    const weatherIcons = {
      '01d': '☀️', '01n': '🌙',
      '02d': '⛅', '02n': '☁️',
      '03d': '☁️', '03n': '☁️',
      '04d': '☁️', '04n': '☁️',
      '09d': '🌧️', '09n': '🌧️',
      '10d': '🌦️', '10n': '🌧️',
      '11d': '⛈️', '11n': '⛈️',
      '13d': '❄️', '13n': '❄️',
      '50d': '🌫️', '50n': '🌫️'
    };

    // 更新时间
    function updateTime () {
      const now = new Date();
      const options = {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      document.getElementById('currentTime').textContent = now.toLocaleDateString('zh-CN', options);
    }

    // 通过经纬度获取中文城市名称
    async function getChineseCityName (latitude, longitude) {
      try {
        // 使用免费的反向地理编码 API
        const response = await fetch(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=zh`
        );
        const data = await response.json();

        // 优先使用市级名称，如果没有则使用区级名称
        if (data.city) {
          return data.city;
        } else if (data.locality) {
          return data.locality;
        } else if (data.principalSubdivision) {
          return data.principalSubdivision;
        }
        return null;
      } catch (error) {
        console.error('获取中文城市名称失败:', error);
        return null;
      }
    }

    // 获取位置和天气
    async function getWeather () {
      const weatherContent = document.getElementById('weatherContent');
      const cityName = document.getElementById('cityName');

      if (!navigator.geolocation) {
        weatherContent.innerHTML = '<div class="error">您的浏览器不支持地理位置定位</div>';
        return;
      }

      try {
        // 获取地理位置
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          });
        });
        // 打印位置信息
        console.log('位置信息:', position);

        const { latitude, longitude } = position.coords;

        // 获取中文城市名称
        const chineseCity = await getChineseCityName(latitude, longitude);
        if (chineseCity) {
          cityName.textContent = chineseCity;
        } else {
          cityName.textContent = '获取位置中...';
        }

        // 调用接口获取天气信息
        // 调用 OpenWeatherMap API（使用免费的 API key，实际使用时需要替换）
        const apiKey = '4d8fb5b93d4af21d66a2948710284366'; // 这是一个公开的 demo key
        const response = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${apiKey}&units=metric&lang=zh_cn`
        );
        // 打印天气信息响应
        console.log('天气信息响应:', response);

        if (!response.ok) {
          throw new Error('获取天气信息失败');
        }

        const data = await response.json();

        // 显示天气信息（传入中文城市名称）
        displayWeather(data, chineseCity);

      } catch (error) {
        console.error('Error:', error);
        weatherContent.innerHTML = `
                    <div class="error">
                        ${error.message || '无法获取天气信息，请检查网络连接'}
                    </div>
                    <button class="refresh-btn" onclick="getWeather()">重试</button>
                `;
      }
    }

    // 显示天气信息
    function displayWeather (data, chineseCityName) {
      const weatherContent = document.getElementById('weatherContent');
      const cityName = document.getElementById('cityName');

      // 更新城市名称（优先使用中文城市名称）
      if (chineseCityName) {
        cityName.textContent = chineseCityName;
      } else if (data.name) {
        cityName.textContent = data.name;
      } else {
        cityName.textContent = '当前位置';
      }

      const iconCode = data.weather[0].icon;
      const icon = weatherIcons[iconCode] || '🌤️';

      weatherContent.innerHTML = `
                <div class="weather-main">
                    <div class="weather-icon">${icon}</div>
                    <div class="temperature">
                        ${Math.round(data.main.temp)}<span>°C</span>
                    </div>
                    <div class="weather-description">
                        ${data.weather[0].description || '未知天气'}
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-icon">💧</div>
                        <div class="detail-value">${data.main.humidity}%</div>
                        <div class="detail-label">湿度</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">💨</div>
                        <div class="detail-value">${Math.round(data.wind.speed)} m/s</div>
                        <div class="detail-label">风速</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">🌡️</div>
                        <div class="detail-value">${Math.round(data.main.feels_like)}°C</div>
                        <div class="detail-label">体感</div>
                    </div>
                </div>

                <button class="refresh-btn" onclick="getWeather()">🔄 刷新天气</button>
            `;
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      updateTime();
      setInterval(updateTime, 1000); // 每秒更新时间
      getWeather(); // 获取天气
    });
  </script>
</body>

</html>
