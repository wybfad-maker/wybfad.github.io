<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Lines Around Center</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <!-- 引入 Three.js 核心库和扩展控件 -->
  <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
  </script>
  <script type="module">
    // 导入 Three.js 核心库和扩展控件
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // 初始化场景、相机、渲染器
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    // 设置相机位置
    camera.position.z = 5;

    // 创建点灯，模拟中心光源
    const pointLight = new THREE.PointLight(0xffffff, 1, 100);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // 创建光线束粒子系统
    const particleCount = 5000;
    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const velocities = new Float32Array(particleCount * 3);

    // 初始化粒子位置、颜色和速度
    for (let i = 0; i < particleCount; i++) {
      // 创建从中心向外辐射的粒子
      const radius = Math.random() * 5;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;

      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.sin(phi) * Math.sin(theta);
      const z = radius * Math.cos(phi);

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      // 根据粒子到中心的距离设置颜色（蓝色到红色的渐变）
      const distance = Math.sqrt(x * x + y * y + z * z);
      const normalizedDistance = distance / 5;

      colors[i * 3] = normalizedDistance; // 红色分量
      colors[i * 3 + 1] = 0.5 * (1 - normalizedDistance); // 绿色分量
      colors[i * 3 + 2] = 1 - normalizedDistance; // 蓝色分量

      // 设置粒子速度
      velocities[i * 3] = 0;
      velocities[i * 3 + 1] = 0;
      velocities[i * 3 + 2] = 0;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // 创建粒子材质
    const particleMaterial = new THREE.PointsMaterial({
      size: 0.05,
      vertexColors: true,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.8
    });

    // 创建粒子系统
    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // 动画循环
    function animate () {
      requestAnimationFrame(animate);

      // 让粒子系统绕中心顺时针旋转
      particles.rotation.y += 0.01;

      // 更新粒子位置，模拟流动效果
      const positions = particles.geometry.attributes.position.array;
      const colors = particles.geometry.attributes.color.array;

      for (let i = 0; i < positions.length; i += 3) {
        // 获取粒子当前位置
        const x = positions[i];
        const y = positions[i + 1];
        const z = positions[i + 2];

        // 计算粒子到中心的距离
        const distance = Math.sqrt(x * x + y * y + z * z);

        // 让粒子缓慢向中心移动
        const speed = 0.001 * (5 - distance);
        positions[i] *= (1 - speed);
        positions[i + 1] *= (1 - speed);
        positions[i + 2] *= (1 - speed);

        // 当粒子到达中心附近时，重新生成
        if (distance < 0.1) {
          const newRadius = 5;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;

          positions[i] = newRadius * Math.sin(phi) * Math.cos(theta);
          positions[i + 1] = newRadius * Math.sin(phi) * Math.sin(theta);
          positions[i + 2] = newRadius * Math.cos(phi);
        }

        // 更新颜色
        const normalizedDistance = Math.sqrt(positions[i] * positions[i] + positions[i + 1] * positions[i + 1] + positions[i + 2] * positions[i + 2]) / 5;
        colors[i] = normalizedDistance;
        colors[i + 1] = 0.5 * (1 - normalizedDistance);
        colors[i + 2] = 1 - normalizedDistance;
      }

      // 标记属性需要更新
      particles.geometry.attributes.position.needsUpdate = true;
      particles.geometry.attributes.color.needsUpdate = true;

      // 渲染场景
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>

</html>
