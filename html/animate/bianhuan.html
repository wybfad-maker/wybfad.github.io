<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--=============== REMIXICONS ===============-->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
  <!--=============== CSS ===============-->
  <link href="css/styles.css" type="text/css">
  <title>Responsive gradient border card - Bedimcode</title>
</head>

<body>
  <div class="container">
    <div class="card__container">
      <article class="card__article">
        <div class="card__scale-1"></div>
        <div class="card__scale-2"></div>
        <div class="card__shape-1">
          <div class="card__shape-2"></div>
          <div class="card__shape-3"> <i class="ri-flashlight-line card__icon"></i>
          </div>
        </div>
        <div class="card__data">
          <h2 class="card__title">超棒卡 01</h2>
          <p class="card__description"> 渐变卡，带亮边
            这让它看起来很酷。 </p>
          <a href="#" class="card__button">继续学习</a>
        </div>
      </article>
      <article class="card__article card__orange">
        <div class="card__scale-1"></div>
        <div class="card__scale-2"></div>
        <div class="card__shape-1">
          <div class="card__shape-2"></div>
          <div class="card__shape-3"> <i class="ri-fire-line card__icon"></i>
          </div>
        </div>
        <div class="card__data">
          <h2 class="card__title">
            超棒卡 02</h2>
          <p class="card__description"> 渐变卡，带亮边
            这让它看起来很酷。 </p> <a href="#" class="card__button">继续学习</a>
        </div>
      </article>
      <article class="card__article card__green">
        <div class="card__scale-1"></div>
        <div class="card__scale-2"></div>
        <div class="card__shape-1">
          <div class="card__shape-2"></div>
          <div class="card__shape-3">
            <i class="ri-shining-line card__icon"></i>
          </div>
        </div>
        <div class="card__data">
          <h2 class="card__title">超棒卡 03</h2>
          <p class="card__description"> 渐变卡，带亮边 这让它看起来很酷。 </p>
          <a href="#" class="card__button">继续学习</a>
        </div>
      </article>
    </div>
  </div>
</body>

</html>
