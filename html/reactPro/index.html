<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Hello React!</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tailwindcss/ui@0.7.4/dist/tailwind-ui.min.css"> -->
  <style>
    * {
      box-sizing: border-box;
      /* padding: 0; */
      /* margin: 0; */
    }
  </style>
</head>

<body>
  <div id="example"></div>
  <script type="text/babel">
    // 导入 useState 钩子函数
    const { useState } = React;
    function Counter () {
      const [count, setCount] = useState(0);
      return <button className="bg-blue-500 size-[30px] hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" onClick={() => setCount(count + 1)}>{count}</button>;
    }
    // 一个简单的组件
    function Welcome ({ name }) {
      return <h5 className="text-sm text-gray-700 font-bold mb-4">Hello, {name}!</h5>;
    }
    // 计算器组件
    function Calculator () {
      const [num1, setNum1] = useState(1);
      const [num2, setNum2] = useState(1);
      const [operator, setOperator] = useState("+");
      const [result, setResult] = useState(2);
      const handleAdd = () => {
        setResult(num1 + num2);
      };
      const handleSubtract = () => {
        setResult(num1 - num2);
      };
      const handleMultiply = () => {
        setResult(num1 * num2);
      };
      const handleDivide = () => {
        setResult(num1 / num2);
      };
      const handelCalculate = () => {
        switch (operator) {
          case "+":
            handleAdd();
            break;
          case "-":
            handleSubtract();
            break;
          case "*":
            handleMultiply();
            break;
          case "/":
            handleDivide();
            break;
          default:
            break;
        }
      };
      return (
        <div className="flex items-center gap-4">
          <input className="border-2 border-gray-200 rounded w-[3rem] h-[30px]" type="number" value={num1} onChange={(e) => setNum1(Number(e.target.value))} />
          <select className="border-2 border-gray-200 rounded w-[3rem] h-[30px]" value={operator} onChange={(e) => setOperator(e.target.value)}>
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
          </select>
          <input className="border-2 border-gray-200 rounded w-[3rem] h-[30px]" type="number" value={num2} onChange={(e) => setNum2(Number(e.target.value))} />
          <button className="bg-blue-500 size-[30px] hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" onClick={handelCalculate}>=</button>
          <span className="ml-4">{result}</span>
        </div>
      );
    }
    const products = [
      { title: '卷心菜', isFruit: false, id: 1 },
      { title: '大蒜', isFruit: false, id: 2 },
      { title: '苹果', isFruit: true, id: 3 },
    ];

    function ShoppingList () {
      const listItems = products.map(product =>
        <li
          key={product.id}
          className="text-lg font-bold mb-2"
          style={{
            color: product.isFruit ? 'magenta' : 'darkgreen'
          }}
        >
          {product.title}
        </li>
      );

      return (
        <ul className="list-disc list-inside">{listItems}</ul>
      );
    }

    // 简单的 React 组件
    // 组件的复用和组合
    function App () {
      return (
        <main className="container p-4">
          <h1 className="text-3xl font-bold mb-4">Hello, React!</h1>
          <Counter />
          <Calculator />
          <div>
            <Welcome name="Alice" />
            <Welcome name="Bob" />
            <Welcome name="Charlie" />
          </div>
          <ShoppingList />
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("example"));
    // 渲染 React 组件到 DOM
    root.render(<App />);
  </script>

</body>

</html>
